<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载站</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">📦</span>
                <h1>文件下载站</h1>
            </div>
            <div class="header-stats">
                <span class="stat-item"><span id="fileCount">0</span> 个文件</span>
                <span class="stat-divider">|</span>
                <span class="stat-item">总计 <span id="totalSize">0 B</span></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="toolbar">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索文件名..." autocomplete="off">
            </div>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-category="all">全部</button>
            </div>
        </div>

        <div class="file-grid" id="fileGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载文件列表...</p>
            </div>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <span class="empty-icon">🔍</span>
            <p>没有找到匹配的文件</p>
        </div>
    </div>

    <footer class="footer">
        <p>文件下载站 &copy; 2026 | 基于 GitHub Pages 部署</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
