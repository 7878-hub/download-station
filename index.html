<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载站</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">📦</span>
                <h1>文件下载站</h1>
            </div>
            <div class="header-stats">
                <span class="stat-item"><span id="fileCount">0</span> 个文件</span>
                <span class="stat-divider">|</span>
                <span class="stat-item">总计 <span id="totalSize">0 B</span></span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="toolbar">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索文件名..." autocomplete="off">
            </div>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-category="all">全部</button>
            </div>
        </div>

        <div class="file-grid" id="fileGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载文件列表...</p>
            </div>
        </div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <span class="empty-icon">🔍</span>
            <p>没有找到匹配的文件</p>
        </div>
    </div>

    <footer class="footer">
        <p>文件下载站 &copy; 2026 | 基于 GitHub Pages 部署</p>
    </footer>

    <!-- 🎮 Konami Code 彩蛋：按 上上下下左右左右 解锁秘密模式 -->
    <div class="konami-pad" id="konamiPad">
        <div class="konami-row">
            <button class="konami-btn" data-dir="up" title="上" aria-label="上">
                <svg viewBox="0 0 24 24" class="konami-arrow"><path d="M12 6 L12 18 M6 12 L12 6 L18 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="konami-btn" data-dir="down" title="下" aria-label="下">
                <svg viewBox="0 0 24 24" class="konami-arrow"><path d="M12 18 L12 6 M6 12 L12 18 L18 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="konami-home" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 11 L12 3 L21 11 M5 9.5 L5 20 L19 20 L19 9.5 M10 20 L10 14 L14 14 L14 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <button class="konami-btn" data-dir="left" title="左" aria-label="左">
                <svg viewBox="0 0 24 24" class="konami-arrow"><path d="M18 12 L6 12 M12 6 L6 12 L12 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="konami-btn" data-dir="right" title="右" aria-label="右">
                <svg viewBox="0 0 24 24" class="konami-arrow"><path d="M6 12 L18 12 M12 6 L18 12 L12 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </div>

    <div class="easter-banner" id="easterBanner">🎉 彩蛋解锁！欢迎进入秘密模式 🎉</div>
    <canvas id="particleCanvas"></canvas>

    <img src="images/easter-egg.png" alt="" class="corner-meme" title="?">

    <!-- 🎃 跳吓彩蛋按钮 -->
    <button class="scare-btn" id="scareBtn" title="?">🎁</button>

    <!-- 跳吓全屏覆盖层 -->
    <div class="scare-overlay" id="scareOverlay">
        <img src="images/jumpscare.png" alt="" class="scare-img">
        <div class="scare-hint">点击任意处关闭</div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
