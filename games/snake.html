<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>贪吃蛇 · 游戏厅</title>
<link rel="stylesheet" href="games.css">
</head>
<body>
<div class="game-topbar">
  <a class="back-btn" href="index.html">← 游戏厅</a>
  <span class="game-title">🐍 贪吃蛇</span>
  <span class="score-badge"><small>分数</small> <b id="score">0</b></span>
</div>

<div class="game-stage" id="stage">
  <canvas id="cv" width="360" height="360"></canvas>
  <div class="game-hint"><b>方向键 / WASD</b> 或滑动屏幕 · <b>空格</b>暂停</div>
  <div class="dpad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="right" data-d="right">▶</button>
    <button class="down" data-d="down">▼</button>
  </div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">🐍 贪吃蛇</h2>
    <p id="ovMsg">吃豆变长，别撞墙别咬自己。</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const N=18, CELL=cv.width/N;
let snake, dir, nextDir, food, score, timer, state='idle';
const scoreEl=document.getElementById('score');

function reset(){
  snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0;
  scoreEl.textContent=0; placeFood();
  draw();
}
function placeFood(){
  let p;
  do{ p={x:(Math.random()*N)|0,y:(Math.random()*N)|0}; }
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}
function draw(){
  ctx.fillStyle='#0f1020'; ctx.fillRect(0,0,cv.width,cv.height);
  // 网格
  ctx.strokeStyle='rgba(255,255,255,.04)';
  for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);ctx.stroke();}
  // 食物
  ctx.fillStyle='#fbbf24';
  roundRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4,5); ctx.fill();
  // 蛇
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#22c55e':'#16a34a';
    roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,5); ctx.fill();
  });
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function step(){
  if(state!=='play')return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
    return over();
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){ score++; scoreEl.textContent=score; placeFood(); }
  else snake.pop();
  draw();
}
function over(){
  state='over';
  document.getElementById('ovTitle').textContent='游戏结束';
  document.getElementById('ovMsg').innerHTML=`本局得分 <b style="color:#fbbf24">${score}</b>`;
  document.getElementById('ovBtn').textContent='再来一局';
  document.getElementById('ov').style.display='flex';
}
function start(){
  reset(); state='play';
  document.getElementById('ov').style.display='none';
  clearInterval(timer); timer=setInterval(step,110);
}
function setDir(d){
  const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  const nd=m[d]; if(!nd)return;
  if(nd.x===-dir.x&&nd.y===-dir.y)return; // 不能反向
  nextDir=nd;
}
document.getElementById('ovBtn').onclick=start;
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','w'].includes(k)){setDir('up');e.preventDefault();}
  else if(['arrowdown','s'].includes(k)){setDir('down');e.preventDefault();}
  else if(['arrowleft','a'].includes(k)){setDir('left');e.preventDefault();}
  else if(['arrowright','d'].includes(k)){setDir('right');e.preventDefault();}
  else if(k===' '){ if(state==='play'){state='pause';} else if(state==='pause'){state='play';} }
});
document.querySelectorAll('.dpad button').forEach(b=>b.onclick=()=>setDir(b.dataset.d));
// 触摸滑动
let tx,ty; cv.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left'); else setDir(dy>0?'down':'up');},{passive:true});
reset();
</script>
</body>
</html>
