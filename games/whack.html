<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>打地鼠 · 游戏厅</title>
<link rel="stylesheet" href="games.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cellipse%20cx%3D%2226%22%20cy%3D%2240%22%20rx%3D%2213%22%20ry%3D%224.5%22%20fill%3D%22%2378350f%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2230%22%20r%3D%224%22%20fill%3D%22%2392400e%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2230%22%20r%3D%224%22%20fill%3D%22%2392400e%22%2F%3E%3Ccircle%20cx%3D%2226%22%20cy%3D%2236%22%20r%3D%228%22%20fill%3D%22%23a16207%22%2F%3E%3Ccircle%20cx%3D%2229%22%20cy%3D%2233%22%20r%3D%222%22%20fill%3D%22%231a1a2e%22%2F%3E%3Cellipse%20cx%3D%2226%22%20cy%3D%2238%22%20rx%3D%222%22%20ry%3D%221.5%22%20fill%3D%22%23f472b6%22%2F%3E%3Cg%20transform%3D%22rotate(38%2014%2010)%22%3E%3Crect%20x%3D%226%22%20y%3D%224%22%20width%3D%2217%22%20height%3D%228%22%20rx%3D%222%22%20fill%3D%22%2364748b%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%226%22%20width%3D%2218%22%20height%3D%224.5%22%20rx%3D%222.2%22%20fill%3D%22%23b45309%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
#field{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:min(85vw,340px); }
.hole{ aspect-ratio:1; background:#a16207; border-radius:50% 50% 40% 40%/55% 55% 35% 35%; position:relative; overflow:hidden; box-shadow:inset 0 -8px 14px rgba(0,0,0,.35), inset 0 6px 8px rgba(255,255,255,.15); cursor:pointer; }
.mole{ position:absolute; left:50%; bottom:14%; transform:translate(-50%,110%); width:66%; font-size:56px; line-height:1; text-align:center; transition:transform .13s ease-out; pointer-events:none; }
.hole.up .mole{ transform:translate(-50%,4%); }
.hole.bonk .mole{ transform:translate(-50%,60%) scale(.8); filter:grayscale(1) brightness(1.4); }
.hole.bonk{ background:#78350f; }
.info-row{ display:flex; gap:14px; font-size:13px; color:var(--text-secondary); }
.info-row b{ color:var(--primary); font-size:16px; }
#timebar{ width:min(85vw,340px); height:8px; background:#e4e7eb; border-radius:4px; margin-top:12px; overflow:hidden; }
#timefill{ height:100%; background:#f97316; border-radius:4px; width:100%; transition:width .2s linear; }
</style>
</head>
<body>
<div class="game-topbar">
  <a class="back-btn" href="index.html">← 游戏厅</a>
  <span class="game-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><ellipse cx="26" cy="40" rx="13" ry="4.5" fill="#78350f"/><circle cx="20" cy="30" r="4" fill="#92400e"/><circle cx="32" cy="30" r="4" fill="#92400e"/><circle cx="26" cy="36" r="8" fill="#a16207"/><circle cx="29" cy="33" r="2" fill="#1a1a2e"/><ellipse cx="26" cy="38" rx="2" ry="1.5" fill="#f472b6"/><g transform="rotate(38 14 10)"><rect x="6" y="4" width="17" height="8" rx="2" fill="#64748b"/><rect x="20" y="6" width="18" height="4.5" rx="2.2" fill="#b45309"/></g></svg> 打地鼠</span>
  <span class="score-badge"><small>得分</small><b id="sc">0</b></span>
</div>
<div class="game-stage">
  <div class="info-row" style="margin-bottom:10px"><span>最高 <b id="best">-</b></span><span id="left">30</span></div>
  <div id="field"></div>
  <div id="timebar"><div id="timefill"></div></div>
  <div class="game-hint">地鼠冒头时点击敲它 · 30 秒内看你能敲几只</div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><ellipse cx="26" cy="40" rx="13" ry="4.5" fill="#78350f"/><circle cx="20" cy="30" r="4" fill="#92400e"/><circle cx="32" cy="30" r="4" fill="#92400e"/><circle cx="26" cy="36" r="8" fill="#a16207"/><circle cx="29" cy="33" r="2" fill="#1a1a2e"/><ellipse cx="26" cy="38" rx="2" ry="1.5" fill="#f472b6"/><g transform="rotate(38 14 10)"><rect x="6" y="4" width="17" height="8" rx="2" fill="#64748b"/><rect x="20" y="6" width="18" height="4.5" rx="2.2" fill="#b45309"/></g></svg> 打地鼠</h2>
    <p id="ovMsg">30 秒限时，敲到尽量多的地鼠。</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>
<script>
let score=0, timeLeft=30, playing=false, spawnT=null, tickT=null, bonkT=[];
const field=document.getElementById('field');
const bestKey='whackbest';
if(localStorage.getItem(bestKey))document.getElementById('best').textContent=localStorage.getItem(bestKey);
const MOLE="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 60 60\"><circle cx=\"18\" cy=\"15\" r=\"7\" fill=\"#92400e\"/><circle cx=\"42\" cy=\"15\" r=\"7\" fill=\"#92400e\"/><circle cx=\"18\" cy=\"15\" r=\"3.5\" fill=\"#d97706\"/><circle cx=\"42\" cy=\"15\" r=\"3.5\" fill=\"#d97706\"/><ellipse cx=\"30\" cy=\"36\" rx=\"22\" ry=\"19\" fill=\"#a16207\"/><ellipse cx=\"30\" cy=\"42\" rx=\"13\" ry=\"9\" fill=\"#b45309\"/><circle cx=\"21\" cy=\"31\" r=\"2.8\" fill=\"#1a1a2e\"/><circle cx=\"39\" cy=\"31\" r=\"2.8\" fill=\"#1a1a2e\"/><circle cx=\"22\" cy=\"30\" r=\".9\" fill=\"#fff\"/><circle cx=\"40\" cy=\"30\" r=\".9\" fill=\"#fff\"/><ellipse cx=\"30\" cy=\"39\" rx=\"4.5\" ry=\"3.2\" fill=\"#f472b6\"/><path d=\"M13 37l-6-2M13 41l-6 2M47 37l6-2M47 41l6 2\" stroke=\"#78350f\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>";
const holes=[];
for(let i=0;i<9;i++){
  const h=document.createElement('div');
  h.className='hole';
  h.innerHTML='<div class="mole">' + MOLE + '</div>';
  h.addEventListener('pointerdown',()=>bonk(h));
  field.appendChild(h); holes.push(h);
}
function popOne(){
  if(!playing)return;
  const free=holes.filter(h=>!h.classList.contains('up')&&!h.classList.contains('bonk'));
  if(free.length){
    const h=free[Math.random()*free.length|0];
    h.classList.add('up');
    const stay=500+Math.random()*600; // 越到后面越快由 spawn 间隔控制
    setTimeout(()=>h.classList.remove('up'),stay);
  }
}
function bonk(h){
  if(!playing)return;
  if(h.classList.contains('up')){
    h.classList.remove('up');
    h.classList.add('bonk');
    score++; document.getElementById('sc').textContent=score;
    const t=setTimeout(()=>h.classList.remove('bonk'),180);
    bonkT.push(t);
  }
}
function start(){
  score=0; timeLeft=30; playing=true;
  holes.forEach(h=>h.classList.remove('up','bonk'));
  bonkT.forEach(clearTimeout); bonkT=[];
  document.getElementById('sc').textContent=0;
  document.getElementById('ov').style.display='none';
  // 地鼠冒头节奏：随时间推移越来越密
  const loop=()=>{
    if(!playing)return;
    popOne();
    if(Math.random()<0.35)popOne();
    const delay=Math.max(280, 900 - (30-timeLeft)*22);
    spawnT=setTimeout(loop,delay);
  };
  loop();
  tickT=setInterval(()=>{
    timeLeft--;
    document.getElementById('left').textContent=timeLeft+' 秒';
    document.getElementById('timefill').style.width=(timeLeft/30*100)+'%';
    if(timeLeft<=0)end();
  },1000);
  document.getElementById('left').textContent='30 秒';
  document.getElementById('timefill').style.width='100%';
}
function end(){
  playing=false;
  clearTimeout(spawnT); clearInterval(tickT);
  holes.forEach(h=>h.classList.remove('up'));
  const b=localStorage.getItem(bestKey);
  if(!b||score>+b){ localStorage.setItem(bestKey,score); document.getElementById('best').textContent=score; }
  document.getElementById('ovTitle').textContent=score>=20?'手速惊人！':'时间到！';
  document.getElementById('ovMsg').textContent=`敲到了 ${score} 只地鼠${score>+b||!b?'，新纪录！':'，最高纪录 '+b+' 只'}`;
  document.getElementById('ovBtn').textContent='再来一局';
  document.getElementById('ov').style.display='flex';
}
document.getElementById('ovBtn').onclick=start;
</script>
</body>
</html>
