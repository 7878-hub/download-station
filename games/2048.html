<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>2048 · 游戏厅</title>
<link rel="stylesheet" href="games.css">
<style>
#board{ width:360px; height:360px; background:#cdc1b4; border-radius:10px; position:relative; padding:10px; }
.cell{ position:absolute; width:80px; height:80px; border-radius:8px; background:#cdc1b4; transition:all .12s ease; }
.tile{ position:absolute; width:80px; height:80px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; transition:left .14s ease,top .14s ease; }
.t2{background:#eee4da;color:#776e65}.t4{background:#ede0c8;color:#776e65}
.t8{background:#f2b179;color:#fff}.t16{background:#f59563;color:#fff}
.t32{background:#f67c5f;color:#fff}.t64{background:#f65e3b;color:#fff}
.t128{background:#edcf72;color:#fff;font-size:34px}.t256{background:#edcc61;color:#fff;font-size:34px}
.t512{background:#edc850;color:#fff;font-size:34px}.t1024{background:#edc53f;color:#fff;font-size:28px}
.t2048{background:#edc22e;color:#fff;font-size:28px}
#board{ width:360px; height:360px; }
</style>
</head>
<body>
<div class="game-topbar">
  <a class="back-btn" href="index.html">← 游戏厅</a>
  <span class="game-title">🔢 2048</span>
  <span class="score-badge"><small>分数</small> <b id="score">0</b></span>
</div>
<div class="game-stage" id="stage">
  <div id="board"></div>
  <div class="game-hint"><b>方向键 / WASD</b> 或滑动屏幕合并相同数字</div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">🔢 2048</h2>
    <p id="ovMsg">滑动合并相同数字，凑出 2048！</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>
<script>
const SIZE=4, PAD=10, CELL=80, GAP=10;
let grid, score, state='idle';
const board=document.getElementById('board');
board.style.width=board.style.height=(PAD*2+SIZE*CELL+(SIZE-1)*GAP)+'px';
const scoreEl=document.getElementById('score');

function empty(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }
function addRandom(){
  const cells=[]; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])cells.push([r,c]);
  if(!cells.length)return;
  const[r,c]=cells[(Math.random()*cells.length)|0];
  grid[r][c]=Math.random()<.9?2:4;
}
function render(){
  board.innerHTML='';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const bg=document.createElement('div'); bg.className='cell';
    bg.style.left=PAD+c*(CELL+GAP)+'px'; bg.style.top=PAD+r*(CELL+GAP)+'px';
    board.appendChild(bg);
    const v=grid[r][c]; if(!v)continue;
    const t=document.createElement('div'); t.className='tile t'+v;
    t.textContent=v; t.style.left=PAD+c*(CELL+GAP)+'px'; t.style.top=PAD+r*(CELL+GAP)+'px';
    board.appendChild(t);
  }
}
function slide(row){
  let arr=row.filter(x=>x); let gained=0;
  for(let i=0;i<arr.length-1;i++){ if(arr[i]===arr[i+1]){arr[i]*=2;gained+=arr[i];arr.splice(i+1,1);} }
  while(arr.length<SIZE)arr.push(0);
  return [arr,gained];
}
function move(dir){
  if(state!=='play')return;
  let moved=false, gained=0;
  const rotate=g=>g[0].map((_,i)=>g.map(r=>r[i])).reverse(); // 顺时针90
  let g=grid.map(r=>r.slice());
  let times={up:3,right:2,down:1,left:0}[dir];
  for(let i=0;i<times;i++)g=rotate(g);
  for(let r=0;r<SIZE;r++){ const[newRow,sc]=slide(g[r]); g[r]=newRow; gained+=sc; if(newRow.join()!==grid[r].join()&&false){} }
  for(let i=0;i<(4-times)%4;i++)g=rotate(g);
  if(g.flat().join()!==grid.flat().join()) moved=true;
  grid=g;
  if(moved){ addRandom(); score+=gained; scoreEl.textContent=score; render(); checkEnd(); }
}
function checkEnd(){
  if(grid.flat().includes(2048)){ win(); return; }
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){ if(!grid[r][c])return; }
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return;
    if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return;
  }
  over();
}
function win(){ state='win'; show('合成 2048！',`最终分数 <b style="color:#fbbf24">${score}</b>`,'再玩一局'); }
function over(){ state='over'; show('游戏结束',`分数 <b style="color:#fbbf24">${score}</b>`,'再来一局'); }
function show(t,m,b){ document.getElementById('ovTitle').textContent=t; document.getElementById('ovMsg').innerHTML=m; document.getElementById('ovBtn').textContent=b; document.getElementById('ov').style.display='flex'; }
function start(){ grid=empty(); score=0; scoreEl.textContent=0; addRandom(); addRandom(); render(); state='play'; document.getElementById('ov').style.display='none'; }
document.getElementById('ovBtn').onclick=start;
document.addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(['arrowup','w'].includes(k)){move('up');e.preventDefault();}
  else if(['arrowdown','s'].includes(k)){move('down');e.preventDefault();}
  else if(['arrowleft','a'].includes(k)){move('left');e.preventDefault();}
  else if(['arrowright','d'].includes(k)){move('right');e.preventDefault();}
});
let tx,ty; board.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
board.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left'); else move(dy>0?'down':'up');},{passive:true});
start();
</script>
</body>
</html>
