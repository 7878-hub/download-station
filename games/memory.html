<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>记忆翻牌 · 游戏厅</title>
<link rel="stylesheet" href="games.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20x%3D%226%22%20y%3D%2212%22%20width%3D%2222%22%20height%3D%2228%22%20rx%3D%223%22%20fill%3D%22%238b5cf6%22%2F%3E%3Cpath%20d%3D%22M11%2018l3-3%203%203-3%203zM15%2028l3-3%203%203-3%203z%22%20fill%3D%22%23c4b5fd%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%228%22%20width%3D%2222%22%20height%3D%2228%22%20rx%3D%223%22%20fill%3D%22%23ede9fe%22%2F%3E%3Cpath%20d%3D%22M31%2014l2.3%205%205.5.6-4.1%203.7%201.2%205.4-4.9-2.9-4.9%202.9%201.2-5.4-4.1-3.7%205.5-.6z%22%20fill%3D%22%238b5cf6%22%2F%3E%3C%2Fsvg%3E">
<style>
#board{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(94vw,380px); }
.card{ aspect-ratio:3/4; perspective:600px; cursor:pointer; }
.inner{ position:relative; width:100%; height:100%; transition:transform .4s; transform-style:preserve-3d; }
.card.flipped .inner{ transform:rotateY(180deg); }
.card.done{ animation:done .5s ease; }
@keyframes done{ 50%{transform:scale(1.08);} }
.face{ position:absolute; inset:0; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:32px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.back{ background:linear-gradient(135deg,#4f6df5,#3b54d4); color:#fff; font-size:24px; }
.front{ background:#fff; border:2px solid #e4e7eb; transform:rotateY(180deg); }
.card.done .front{ border-color:#22c55e; background:#dcfce7; }
</style>
</head>
<body>
<div class="game-topbar">
  <a class="back-btn" href="index.html">← 游戏厅</a>
  <span class="game-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect x="6" y="12" width="22" height="28" rx="3" fill="#8b5cf6"/><path d="M11 18l3-3 3 3-3 3zM15 28l3-3 3 3-3 3z" fill="#c4b5fd"/><rect x="20" y="8" width="22" height="28" rx="3" fill="#ede9fe"/><path d="M31 14l2.3 5 5.5.6-4.1 3.7 1.2 5.4-4.9-2.9-4.9 2.9 1.2-5.4-4.1-3.7 5.5-.6z" fill="#8b5cf6"/></svg> 记忆翻牌</span>
  <span class="score-badge"><small>步数</small> <b id="moves">0</b></span>
</div>
<div class="game-stage">
  <div id="board"></div>
  <div class="game-hint">翻开两张相同图案即可配对</div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect x="6" y="12" width="22" height="28" rx="3" fill="#8b5cf6"/><path d="M11 18l3-3 3 3-3 3zM15 28l3-3 3 3-3 3z" fill="#c4b5fd"/><rect x="20" y="8" width="22" height="28" rx="3" fill="#ede9fe"/><path d="M31 14l2.3 5 5.5.6-4.1 3.7 1.2 5.4-4.9-2.9-4.9 2.9 1.2-5.4-4.1-3.7 5.5-.6z" fill="#8b5cf6"/></svg> 记忆翻牌</h2>
    <p id="ovMsg">翻开所有配对，步数越少越好！</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>
<script>
const ICONS=["<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><path d=\"M20 9V4\" stroke=\"#78350f\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M20 5c1-3 5-3 6-1-1 2-4 3-6 1z\" fill=\"#22c55e\"/><circle cx=\"20\" cy=\"23\" r=\"13\" fill=\"#ef4444\"/><circle cx=\"15\" cy=\"18\" r=\"3.5\" fill=\"#fca5a5\"/></svg>","<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><path d=\"M8 7c1 14 10 24 24 25 3 0 5-.7 6-2-3 .8-7 .4-11-2C17 23 12 15 11 7z\" fill=\"#facc15\" stroke=\"#eab308\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M7 6l2-2 3 3-2 2z\" fill=\"#a16207\"/></svg>","<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><path d=\"M20 11V4\" stroke=\"#16a34a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><path d=\"M20 4c3-2 6-1 7 1-3 2-5 1-7-1z\" fill=\"#22c55e\"/><g fill=\"#8b5cf6\"><circle cx=\"13\" cy=\"16\" r=\"5\"/><circle cx=\"27\" cy=\"16\" r=\"5\"/><circle cx=\"7\" cy=\"23\" r=\"5\"/><circle cx=\"20\" cy=\"23\" r=\"5\"/><circle cx=\"33\" cy=\"23\" r=\"5\"/><circle cx=\"13\" cy=\"30\" r=\"5\"/><circle cx=\"27\" cy=\"30\" r=\"5\"/><circle cx=\"20\" cy=\"36\" r=\"5\"/></g></svg>","<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><path d=\"M20 12c7 0 12 4 12 10 0 8-6 15-12 15S8 30 8 22c0-6 5-10 12-10z\" fill=\"#ef4444\"/><path d=\"M13 7l3 4 4-5 4 5 3-4 1 6H12z\" fill=\"#22c55e\"/><g fill=\"#fde047\"><circle cx=\"15\" cy=\"22\" r=\"1.3\"/><circle cx=\"25\" cy=\"22\" r=\"1.3\"/><circle cx=\"20\" cy=\"27\" r=\"1.3\"/><circle cx=\"15\" cy=\"31\" r=\"1.3\"/><circle cx=\"25\" cy=\"31\" r=\"1.3\"/><circle cx=\"20\" cy=\"19\" r=\"1.3\"/></g></svg>","<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"15\" fill=\"#84cc16\"/><circle cx=\"20\" cy=\"20\" r=\"12\" fill=\"#d9f99d\"/><circle cx=\"20\" cy=\"20\" r=\"4\" fill=\"#fff\"/><g fill=\"#1a1a2e\"><circle cx=\"20\" cy=\"12.5\" r=\"1.1\"/><circle cx=\"26\" cy=\"15\" r=\"1.1\"/><circle cx=\"27.5\" cy=\"20\" r=\"1.1\"/><circle cx=\"26\" cy=\"25\" r=\"1.1\"/><circle cx=\"20\" cy=\"27.5\" r=\"1.1\"/><circle cx=\"14\" cy=\"25\" r=\"1.1\"/><circle cx=\"12.5\" cy=\"20\" r=\"1.1\"/><circle cx=\"14\" cy=\"15\" r=\"1.1\"/></g></svg>","<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><circle cx=\"15\" cy=\"22\" r=\"11\" fill=\"#fb923c\"/><circle cx=\"25\" cy=\"22\" r=\"11\" fill=\"#f97316\"/><path d=\"M20 12v20\" stroke=\"#ea580c\" stroke-width=\"1.5\" opacity=\".5\"/><path d=\"M20 9V4\" stroke=\"#78350f\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M20 4c3-2 6-1 7 1-3 2-5 1-7-1z\" fill=\"#22c55e\"/></svg>","<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><path d=\"M14 20c1-8 4-13 10-16\" stroke=\"#16a34a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M27 20c-1-9 1-13 6-15\" stroke=\"#16a34a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M23 4c3-2 6-1 7 1-3 2-5 1-7-1z\" fill=\"#22c55e\"/><circle cx=\"13\" cy=\"26\" r=\"7.5\" fill=\"#ef4444\"/><circle cx=\"28\" cy=\"26\" r=\"7.5\" fill=\"#dc2626\"/><circle cx=\"11\" cy=\"23\" r=\"2\" fill=\"#fca5a5\"/><circle cx=\"26\" cy=\"23\" r=\"2\" fill=\"#fca5a5\"/></svg>","<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"36\" height=\"36\" viewBox=\"0 0 40 40\"><path d=\"M4 22A16 16 0 0 0 36 22Z\" fill=\"#16a34a\"/><path d=\"M7 22A13 13 0 0 0 33 22Z\" fill=\"#f0fdf4\"/><path d=\"M9 22A11 11 0 0 0 31 22Z\" fill=\"#ef4444\"/><g fill=\"#1a1a2e\"><ellipse cx=\"15\" cy=\"24\" rx=\"1.1\" ry=\"1.7\"/><ellipse cx=\"20\" cy=\"26\" rx=\"1.1\" ry=\"1.7\"/><ellipse cx=\"25\" cy=\"24\" rx=\"1.1\" ry=\"1.7\"/><ellipse cx=\"17.5\" cy=\"19\" rx=\"1.1\" ry=\"1.7\"/><ellipse cx=\"22.5\" cy=\"19\" rx=\"1.1\" ry=\"1.7\"/></g></svg>"];
let deck, flipped, matched, moves, lock, state;
const board=document.getElementById('board');
const movesEl=document.getElementById('moves');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function build(){
  deck=shuffle([...ICONS,...ICONS]);
  board.innerHTML=''; moves=0; movesEl.textContent=0; flipped=[]; matched=0; lock=false;
  deck.forEach((e,i)=>{ const c=document.createElement('div'); c.className='card'; c.dataset.i=i; c.innerHTML=`<div class="inner"><div class="back"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 40 40"><path d="M14 14a6 6 0 1 1 9.5 4.8c-2.2 1.3-3.5 2.6-3.5 5.2" fill="none" stroke="#dfe6ff" stroke-width="3.4" stroke-linecap="round"/><circle cx="20" cy="31" r="2.4" fill="#dfe6ff"/></svg></div><div class="front">${e}</div></div>`; board.appendChild(c); });
}
function flip(i){ if(lock||state!=='play')return; const card=board.children[i]; if(card.classList.contains('flipped')||card.classList.contains('done'))return; card.classList.add('flipped'); flipped.push(i); if(flipped.length===2){ moves++; movesEl.textContent=moves; lock=true; check(); } }
function check(){ const[a,b]=flipped; if(deck[a]===deck[b]){ setTimeout(()=>{ board.children[a].classList.add('done'); board.children[b].classList.add('done'); matched+=2; flipped=[]; lock=false; if(matched===deck.length)win(); },300); } else { setTimeout(()=>{ board.children[a].classList.remove('flipped'); board.children[b].classList.remove('flipped'); flipped=[]; lock=false; },800); } }
function win(){ state='win'; document.getElementById('ovTitle').textContent='全部配对'; document.getElementById('ovMsg').innerHTML=`用了 <b style="color:#fbbf24">${moves}</b> 步`; document.getElementById('ovBtn').textContent='再来一局'; document.getElementById('ov').style.display='flex'; }
function start(){ build(); state='play'; document.getElementById('ov').style.display='none'; }
document.getElementById('ovBtn').onclick=start;
board.addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c)flip(+c.dataset.i); });
</script>
</body>
</html>
