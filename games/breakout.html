<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>打砖块 · 游戏厅</title>
<link rel="stylesheet" href="games.css">
</head>
<body>
<div class="game-topbar">
  <a class="back-btn" href="index.html">← 游戏厅</a>
  <span class="game-title">🧱 打砖块</span>
  <span class="score-badge"><small>分数</small> <b id="score">0</b> · <small>命</small><b id="lives">3</b></span>
</div>
<div class="game-stage" id="stage">
  <canvas id="cv" width="400" height="480"></canvas>
  <div class="game-hint"><b>鼠标 / 手指</b>左右移动挡板 · <b>← →</b> 也可</div>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">🧱 打砖块</h2>
    <p id="ovMsg">弹球击碎所有砖块。</p>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
const PADDLE_W=84, PADDLE_H=12, BALL_R=7;
const BRICK_ROWS=5, BRICK_COLS=9, BRICK_W=40, BRICK_H=16, BRICK_TOP=40, BRICK_GAP=4;
let paddle, ball, bricks, score, lives, vx, vy, raf, state;
const scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives');

function reset(){
  paddle={x:W/2-PADDLE_W/2,y:H-24};
  ball={x:W/2,y:H-40,vx:0,vy:0,stuck:true};
  bricks=[];
  const totalW=BRICK_COLS*(BRICK_W+BRICK_GAP)-BRICK_GAP;
  const offX=(W-totalW)/2;
  for(let r=0;r<BRICK_ROWS;r++)for(let c=0;c<BRICK_COLS;c++){
    bricks.push({x:offX+c*(BRICK_W+BRICK_GAP),y:BRICK_TOP+r*(BRICK_H+BRICK_GAP),alive:true,color:['#ef4444','#f59e0b','#fbbf24','#22c55e','#3b82f6'][r]});
  }
}
function launch(){ if(!ball.stuck)return; ball.stuck=false; const ang=(Math.random()*0.6-0.3); const sp=4.4; ball.vx=sp*Math.sin(ang); ball.vy=-sp*Math.cos(ang); }
function draw(){
  ctx.fillStyle='#0f1020'; ctx.fillRect(0,0,W,H);
  bricks.forEach(b=>{ if(!b.alive)return; ctx.fillStyle=b.color; roundRect(b.x,b.y,BRICK_W,BRICK_H,4); ctx.fill(); });
  ctx.fillStyle='#4f6df5'; roundRect(paddle.x,paddle.y,PADDLE_W,PADDLE_H,6); ctx.fill();
  ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL_R,0,7); ctx.fill();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function update(){
  if(state!=='play'){ return; }
  if(ball.stuck){ ball.x=paddle.x+PADDLE_W/2; ball.y=paddle.y-BALL_R-1; }
  else{ ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x<BALL_R){ball.x=BALL_R;ball.vx*=-1;} if(ball.x>W-BALL_R){ball.x=W-BALL_R;ball.vx*=-1;}
    if(ball.y<BALL_R){ball.y=BALL_R;ball.vy*=-1;}
    if(ball.y>paddle.y+PADDLE_H){ lives--; livesEl.textContent=lives; if(lives<=0){return over();} ball.stuck=true; ball.x=paddle.x+PADDLE_W/2; ball.y=paddle.y-BALL_R-1; }
    else if(ball.vy>0 && ball.y+BALL_R>=paddle.y && ball.y+BALL_R<=paddle.y+PADDLE_H && ball.x>=paddle.x && ball.x<=paddle.x+PADDLE_W){
      ball.y=paddle.y-BALL_R; const rel=(ball.x-(paddle.x+PADDLE_W/2))/(PADDLE_W/2); const ang=rel*1.05; const sp=Math.hypot(ball.vx,ball.vy); ball.vx=sp*Math.sin(ang); ball.vy=-Math.abs(sp*Math.cos(ang));
    }
    for(const b of bricks){ if(!b.alive)continue; if(ball.x+BALL_R>b.x&&ball.x-BALL_R<b.x+BRICK_W&&ball.y+BALL_R>b.y&&ball.y-BALL_R<b.y+BRICK_H){ b.alive=false; score+=10; scoreEl.textContent=score; if(ball.y+BALL_R<b.y+BRICK_H&&ball.y-BALL_R>b.y){ball.vy*=-1;} else {ball.vx*=-1;} break; } }
    if(bricks.every(b=>!b.alive)){ return win(); }
  }
  draw(); raf=requestAnimationFrame(update);
}
function win(){ state='win'; show('全部击碎！',`分数 <b style="color:#fbbf24">${score}</b> 🎉`,'再玩一局'); cancelAnimationFrame(raf); }
function over(){ state='over'; show('游戏结束',`分数 <b style="color:#fbbf24">${score}</b>`,'再来一局'); cancelAnimationFrame(raf); }
function show(t,m,b){ document.getElementById('ovTitle').textContent=t; document.getElementById('ovMsg').innerHTML=m; document.getElementById('ovBtn').textContent=b; document.getElementById('ov').style.display='flex'; }
function start(){ reset(); score=0; lives=3; scoreEl.textContent=0; livesEl.textContent=3; state='play'; document.getElementById('ov').style.display='none'; cancelAnimationFrame(raf); raf=requestAnimationFrame(update); }
document.getElementById('ovBtn').onclick=start;
cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect(); paddle.x=Math.max(0,Math.min(W-PADDLE_W,(e.clientX-r.left)*(W/r.width)-PADDLE_W/2)); });
cv.addEventListener('touchmove',e=>{ const r=cv.getBoundingClientRect(); const t=e.touches[0]; paddle.x=Math.max(0,Math.min(W-PADDLE_W,(t.clientX-r.left)*(W/r.width)-PADDLE_W/2)); e.preventDefault(); },{passive:false});
cv.addEventListener('click',launch); cv.addEventListener('touchstart',launch,{passive:true});
document.addEventListener('keydown',e=>{ if(state!=='play')return; const k=e.key.toLowerCase(); if(k==='arrowleft'||k==='a'){paddle.x=Math.max(0,paddle.x-24);} else if(k==='arrowright'||k==='d'){paddle.x=Math.min(W-PADDLE_W,paddle.x+24);} else if(k===' '){launch();} });
</script>
</body>
</html>
